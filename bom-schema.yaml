# Forkable Factory – BOM Schema v0.1
# JSON Schema expressed in YAML for readability.
# Validates bom.yaml structure.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Forkable Factory BOM"
description: "Bill of Materials schema for forkable product repositories."
type: object

required:
  - product_id
  - revision
  - date
  - currency
  - assemblies

properties:
  product_id:
    type: string
    description: "Unique product identifier (matches spec)"

  revision:
    type: string
    description: "BOM revision number"

  date:
    type: string
    format: date

  status:
    type: string
    enum: [draft, review, approved, obsolete]

  currency:
    type: string
    description: "ISO 4217 currency code for all costs"

  notes:
    type: string

  assemblies:
    type: array
    description: "Top-level assemblies that make up the product"
    items:
      $ref: "#/$defs/assembly"

$defs:
  assembly:
    type: object
    required: [id, name, components]
    properties:
      id:
        type: string
        description: "Assembly identifier (e.g., ASM-MUG)"
      name:
        type: string
      description:
        type: string
      quantity:
        type: integer
        default: 1
      components:
        type: array
        items:
          $ref: "#/$defs/component"

  component:
    type: object
    required: [id, name, category, quantity]
    properties:
      id:
        type: string
        description: "Component identifier (e.g., MUG-001)"
      name:
        type: string
      description:
        type: string
      category:
        type: string
        enum:
          - mechanical
          - electrical
          - packaging
          - fastener
          - label
          - document
      quantity:
        type: number
        description: "Quantity per assembly"
      unit:
        type: string
        description: "Unit of measure (pcs, m, kg, ml, etc.)"
        default: "pcs"
      material:
        type: string
        description: "Primary material"
      specifications:
        type: object
        description: "Key-value pairs of technical specifications"
        additionalProperties:
          type: string
      supplier:
        $ref: "#/$defs/supplier"
      unit_cost:
        type: number
        description: "Cost per unit in specified currency"
      moq:
        type: integer
        description: "Minimum order quantity"
      lead_time_days:
        type: integer
        description: "Supplier lead time in calendar days"
      compliance:
        type: array
        description: "Applicable compliance requirements"
        items:
          type: string
      alternatives:
        type: array
        description: "Alternative components (second source)"
        items:
          type: object
          properties:
            name:
              type: string
            supplier:
              type: string
            notes:
              type: string
      notes:
        type: string

  supplier:
    type: object
    properties:
      name:
        type: string
      type:
        type: string
        enum: [manufacturer, distributor, contract_manufacturer, marketplace]
      location:
        type: string
        description: "Country or region"
      url:
        type: string
        format: uri
      part_number:
        type: string
        description: "Supplier's part number"
